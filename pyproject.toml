[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "khamyang"
version = "1.0.0"
description = "A Python language library and revitalization toolkit for Tai Khamyang (ksu)"
authors = [
    { name = "Khamyang Language Revitalization Initiative", email = "info@khamyang-language.org" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.8"
keywords = ["khamyang", "tai-khamyang", "endangered-languages", "linguistics", "assam", "nlp", "tai-kadai"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Text Processing :: Linguistic",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "click>=8.0.0",
    "rich>=12.0.0",
    "fastapi>=0.80.0",
    "uvicorn>=0.18.0",
]

[project.scripts]
khamyang = "khamyang.cli:cli"
